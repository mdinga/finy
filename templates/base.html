{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}FINY{% endblock %}</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="{% static 'ui/css/workspace.css' %}">
  <link rel="icon" type="image/svg+xml" href="{% static 'ui/images/favicons/favicon.svg' %}">
  <link rel="icon" type="image/png" sizes="96x96" href="{% static 'ui/images/favicons/favicon-96x96.png' %}">
  <link rel="shortcut icon" href="{% static 'ui/images/favicons/favicon.ico' %}">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'ui/images/favicons/apple-touch-icon.png' %}">
  <link rel="manifest" href="{% static 'ui/images/favicons/site.webmanifest' %}">

  {% if GA_MEASUREMENT_ID %}
  <script async src="https://www.googletagmanager.com/gtag/js?id={{ GA_MEASUREMENT_ID }}"></script>
  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      window.dataLayer.push(arguments);
    }

    gtag("js", new Date());
    gtag("config", "{{ GA_MEASUREMENT_ID }}");
  </script>
  {% endif %}

  {% block extra_head %}{% endblock %}
</head>
<body>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
