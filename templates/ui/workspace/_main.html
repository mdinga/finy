{% load static %}
<section class="col-12 col-lg-9">
  <div class="mb-2">
    <form id="global-search-form" class="d-flex gap-2 mb-2">
      <input id="global-search-input" type="text" class="form-control" placeholder="Search tasks...">
      <button class="btn btn-plain" type="submit">Search</button>
      <button id="clear-search-btn" class="btn btn-plain" type="button">Clear</button>
    </form>

    <form id="new-task-form" class="d-flex gap-2 mb-2">
      <input id="nt-title" type="text" class="form-control" placeholder="Add a new task..." required>
      <button class="btn btn-plain" type="submit">Add</button>
    </form>
  </div>

  <div id="list-view">
    <div id="task-filter-bar" class="d-none mb-3">
  <div class="row g-2 align-items-end">
    <div class="col-12 col-md-4" id="filter-space-wrap">
      <label class="form-label small">Filter by space</label>
      <select id="filter-space" class="form-select form-select-sm">
        <option value="">All spaces</option>
      </select>
    </div>

    <div class="col-12 col-md-4" id="filter-folder-wrap">
      <label class="form-label small">Filter by folder</label>
      <select id="filter-folder" class="form-select form-select-sm">
        <option value="">All folders</option>
      </select>
    </div>


    <div class="col-12 col-md-4">
      <label class="form-label small">Sort by</label>
      <select id="filter-sort" class="form-select form-select-sm">
        <option value="planned_date">Planned date</option>
        <option value="due_date">Due date</option>
        <option value="estimated_minutes">Quickest first</option>
      </select>
    </div>

    <div class="col-12 d-flex gap-2 justify-content-end">
      <button id="apply-task-filters" type="button" class="btn btn-plain btn-sm">Apply</button>
      <button id="clear-task-filters" type="button" class="btn btn-plain btn-sm">Clear filters</button>
    </div>
  </div>
</div>

    <div class="d-flex align-items-center justify-content-between mb-2">
      <h2 id="list-title" class="h6 m-0">Inbox</h2>
    </div>

    <div class="hint mb-3">Tip: Keep the title short. Add dates and time under Details.</div>

    <div id="task-list"></div>
  </div>

  <div id="calendar-view" class="d-none">
    <div class="d-flex align-items-center justify-content-between mb-2">
      <div class="d-flex align-items-center gap-2">
        <button id="calPrev" class="btn btn-plain btn-sm" type="button">‹</button>
        <h2 id="calendar-title" class="h6 m-0">Calendar</h2>
        <button id="calNext" class="btn btn-plain btn-sm" type="button">›</button>
      </div>

      <div class="d-flex align-items-center gap-2">
        <span class="hint m-0">Planned dates only</span>
        <button id="calBackToList" class="btn btn-plain btn-sm" type="button">Back</button>
      </div>
    </div>

    <div id="calendar-list" class="calendar-list"></div>
  </div>

  <div class="modal fade" id="taskModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="taskModalTitle">Task</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="taskModalBody"></div>
      </div>
    </div>
  </div>
</section>
