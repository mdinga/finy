{% load static %}
<!doctype html>
<html lang="en">
<head>
  {% include "ui/workspace/_head.html" %}
</head>
<body class="workspace-page text-dark">
  {% csrf_token %}
  <input type="hidden" id="csrf" value="{{ csrf_token }}">

  {% include "ui/workspace/_topbar.html" %}

  <main class="container-fluid my-4">
    <div class="row g-3">
      {% include "ui/workspace/_sidebar.html" %}
      {% include "ui/workspace/_main.html" %}
    </div>
  </main>

  <div class="modal fade" id="workspaceAchievementModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content achievement-card">
        <div class="modal-body text-center">
          <img
            id="workspaceAchievementBadge"
            src=""
            alt=""
            class="achievement-badge-large d-none mx-auto mb-3">

          <div class="hint mb-1">Achievement Unlocked</div>

          <h2 id="workspaceAchievementName" class="h4 mb-2"></h2>

          <p id="workspaceAchievementMessage" class="mb-4 text-muted"></p>

          <button id="workspaceAchievementContinue" type="button" class="btn workspace-btn-lime">
            Continue
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.FINY = {
      api: {
        folders: "/api/folders/",
        spaces: "/api/spaces/",
        tasks: "/api/tasks/",
        priority: "/api/tasks/priority/",
        today: "/api/tasks/today/",
        upcoming: "/api/tasks/upcoming/",
        spaceCategories: "/api/space-categories/",
        plannedRange: "/api/tasks/planned-range/",
        counts: "/api/tasks/counts/",
        overdue: '/api/tasks/overdue/',
        achievementStatus: "/api/achievements/status/",
        achievementSeen: "/api/achievements/",

      }
    };
  </script>
  <script src="{% static 'ui/js/workspace.js' %}"></script>
</body>
</html>
